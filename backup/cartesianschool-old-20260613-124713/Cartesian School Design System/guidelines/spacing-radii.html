<!-- @dsCard group="Spacing" viewport="700x180" name="Radii" subtitle="The brand leans round — pills and 2xl cards" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  body { padding: 28px; display: flex; gap: 18px; align-items: flex-end; flex-wrap: wrap; }
  .box { width: 84px; height: 72px; background: var(--surface-sunken); border: 1px solid var(--border-strong); }
  .lbl { text-align: center; font-family: var(--font-mono); font-size: 11px; color: var(--text-muted); margin-top: 8px; }
  .pill { width: 120px; height: 44px; background: var(--action-primary); border-radius: var(--radius-pill); }
</style>
</head>
<body>
  <div><div class="box" style="border-radius:var(--radius-sm)"></div><div class="lbl">sm · 8</div></div>
  <div><div class="box" style="border-radius:var(--radius-md)"></div><div class="lbl">md · 12</div></div>
  <div><div class="box" style="border-radius:var(--radius-lg)"></div><div class="lbl">lg · 16</div></div>
  <div><div class="box" style="border-radius:var(--radius-xl)"></div><div class="lbl">xl · 24</div></div>
  <div><div class="box" style="border-radius:var(--radius-2xl)"></div><div class="lbl">2xl · 28</div></div>
  <div><div class="pill"></div><div class="lbl">pill · button</div></div>
</body>
</html>
