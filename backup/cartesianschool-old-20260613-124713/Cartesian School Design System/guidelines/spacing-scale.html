<!-- @dsCard group="Spacing" viewport="700x230" name="Spacing scale" subtitle="8px base grid with 4px half-steps" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  body { padding: 28px; display: grid; gap: 10px; }
  .row { display: flex; align-items: center; gap: 14px; }
  .bar { height: 16px; background: var(--brand-gradient); border-radius: 4px; }
  .tag { font-family: var(--font-mono); font-size: 11px; color: var(--text-muted); width: 70px; }
  .px { font-family: var(--font-mono); font-size: 11px; color: var(--text-faint); }
</style>
</head>
<body>
  <div class="row"><span class="tag">space-2</span><div class="bar" style="width:8px"></div><span class="px">8px</span></div>
  <div class="row"><span class="tag">space-4</span><div class="bar" style="width:16px"></div><span class="px">16px</span></div>
  <div class="row"><span class="tag">space-6</span><div class="bar" style="width:24px"></div><span class="px">24px</span></div>
  <div class="row"><span class="tag">space-8</span><div class="bar" style="width:32px"></div><span class="px">32px</span></div>
  <div class="row"><span class="tag">space-12</span><div class="bar" style="width:48px"></div><span class="px">48px</span></div>
  <div class="row"><span class="tag">space-16</span><div class="bar" style="width:64px"></div><span class="px">64px</span></div>
  <div class="row"><span class="tag">space-28</span><div class="bar" style="width:112px"></div><span class="px">112px · section</span></div>
</body>
</html>
