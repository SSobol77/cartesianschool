<!-- @dsCard group="Colors" viewport="700x170" name="Deep space" subtitle="Dark sections, footers and the logo backdrop" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  body { padding: 24px; }
  .row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; }
  .sw { border-radius: var(--radius-md); overflow: hidden; border: 1px solid var(--border-subtle); }
  .chip { height: 72px; }
  .meta { padding: 8px 10px; }
  .name { font-size: 12px; font-weight: 600; color: var(--text-strong); }
  .hex { font-family: var(--font-mono); font-size: 11px; color: var(--text-muted); text-transform: uppercase; }
</style>
</head>
<body>
  <div class="row">
    <div class="sw"><div class="chip" style="background:var(--space-950)"></div><div class="meta"><div class="name">space-950</div><div class="hex">#0A0820</div></div></div>
    <div class="sw"><div class="chip" style="background:var(--space-900)"></div><div class="meta"><div class="name">space-900</div><div class="hex">#120D2E</div></div></div>
    <div class="sw"><div class="chip" style="background:var(--space-800)"></div><div class="meta"><div class="name">space-800</div><div class="hex">#1B1442</div></div></div>
    <div class="sw"><div class="chip" style="background:var(--space-700)"></div><div class="meta"><div class="name">space-700</div><div class="hex">#271C5E</div></div></div>
  </div>
</body>
</html>
