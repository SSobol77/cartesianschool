<!-- @dsCard group="Type" viewport="700x250" name="Body, lead & meta" subtitle="Reading sizes and the uppercase eyebrow" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  body { padding: 28px; display: grid; gap: 16px; max-width: 640px; }
  .tag { font-family: var(--font-mono); font-size: 11px; color: var(--text-faint); }
  .eyebrow { font-size: var(--text-xs); font-weight: 600; text-transform: uppercase; letter-spacing: var(--tracking-wide); color: var(--text-accent); }
  .lead { font-size: var(--text-lead); color: var(--text-body); line-height: var(--leading-relaxed); }
  .body { font-size: var(--text-body); color: var(--text-body); line-height: var(--leading-normal); }
  .meta { font-size: var(--text-sm); color: var(--text-muted); }
</style>
</head>
<body>
  <div><span class="tag">eyebrow · xs</span><div class="eyebrow">Process</div></div>
  <div><span class="tag">lead · 20</span><p class="lead">We find what your current site is costing you, rebuild it fast and mobile-first.</p></div>
  <div><span class="tag">body · 16</span><p class="body">Every project is a real, live rebuild for a real local business. Open any of them on your phone, right now.</p></div>
  <div><span class="tag">meta · 14</span><p class="meta">7 live rebuilds for Austin businesses</p></div>
</body>
</html>
