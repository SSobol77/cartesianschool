<!-- @dsCard group="Colors" viewport="700x180" name="Neutral / slate" subtitle="Text, surfaces and borders across the product" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  body { padding: 24px; }
  .row { display: grid; grid-template-columns: repeat(11, 1fr); gap: 6px; }
  .sw { border-radius: var(--radius-sm); overflow: hidden; border: 1px solid var(--border-subtle); }
  .chip { height: 56px; }
  .meta { padding: 6px 6px; }
  .name { font-size: 10px; font-weight: 600; color: var(--text-strong); }
  .hex { font-family: var(--font-mono); font-size: 9px; color: var(--text-muted); }
</style>
</head>
<body>
  <div class="row">
    <div class="sw"><div class="chip" style="background:var(--slate-50)"></div><div class="meta"><div class="name">50</div></div></div>
    <div class="sw"><div class="chip" style="background:var(--slate-100)"></div><div class="meta"><div class="name">100</div></div></div>
    <div class="sw"><div class="chip" style="background:var(--slate-200)"></div><div class="meta"><div class="name">200</div></div></div>
    <div class="sw"><div class="chip" style="background:var(--slate-300)"></div><div class="meta"><div class="name">300</div></div></div>
    <div class="sw"><div class="chip" style="background:var(--slate-400)"></div><div class="meta"><div class="name">400</div></div></div>
    <div class="sw"><div class="chip" style="background:var(--slate-500)"></div><div class="meta"><div class="name">500</div></div></div>
    <div class="sw"><div class="chip" style="background:var(--slate-600)"></div><div class="meta"><div class="name">600</div></div></div>
    <div class="sw"><div class="chip" style="background:var(--slate-700)"></div><div class="meta"><div class="name">700</div></div></div>
    <div class="sw"><div class="chip" style="background:var(--slate-800)"></div><div class="meta"><div class="name">800</div></div></div>
    <div class="sw"><div class="chip" style="background:var(--slate-900)"></div><div class="meta"><div class="name">900</div></div></div>
    <div class="sw"><div class="chip" style="background:var(--slate-950)"></div><div class="meta"><div class="name">950</div></div></div>
  </div>
</body>
</html>
