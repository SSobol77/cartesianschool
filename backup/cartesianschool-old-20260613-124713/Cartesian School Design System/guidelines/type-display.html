<!-- @dsCard group="Type" viewport="700x300" name="Display & headings" subtitle="Geist, tight tracking, balanced wrap" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  body { padding: 28px; display: grid; gap: 14px; }
  .line { display: flex; align-items: baseline; gap: 16px; }
  .tag { font-family: var(--font-mono); font-size: 11px; color: var(--text-faint); white-space: nowrap; width: 96px; }
  .d { font-size: var(--text-display); font-weight: 800; letter-spacing: var(--tracking-tight); line-height: var(--leading-tight); color: var(--text-strong); }
  .h1 { font-size: var(--text-h1); font-weight: 700; letter-spacing: var(--tracking-tight); color: var(--text-strong); }
  .h2 { font-size: var(--text-h2); font-weight: 700; letter-spacing: var(--tracking-tight); color: var(--text-strong); }
  .h3 { font-size: var(--text-h3); font-weight: 700; color: var(--text-strong); }
</style>
</head>
<body>
  <div class="line"><span class="tag">display</span><span class="d">See it live</span></div>
  <div class="line"><span class="tag">h1</span><span class="h1">How it works</span></div>
  <div class="line"><span class="tag">h2</span><span class="h2">Live rebuilds</span></div>
  <div class="line"><span class="tag">h3</span><span class="h3">Free Audit</span></div>
</body>
</html>
