<!-- @dsCard group="Colors" viewport="700x180" name="Brand ramp" subtitle="The three logo shells: violet → indigo → blue" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  body { padding: 24px; }
  .row { display: grid; grid-template-columns: repeat(7, 1fr); gap: 10px; }
  .sw { border-radius: var(--radius-md); overflow: hidden; border: 1px solid var(--border-subtle); }
  .chip { height: 64px; }
  .meta { padding: 8px 10px; }
  .name { font-size: 12px; font-weight: 600; color: var(--text-strong); }
  .hex { font-family: var(--font-mono); font-size: 11px; color: var(--text-muted); text-transform: uppercase; }
</style>
</head>
<body>
  <div class="row">
    <div class="sw"><div class="chip" style="background:var(--violet-600)"></div><div class="meta"><div class="name">violet-600</div><div class="hex">#7C3AED</div></div></div>
    <div class="sw"><div class="chip" style="background:var(--indigo-550)"></div><div class="meta"><div class="name">indigo-550</div><div class="hex">#5B3DF5</div></div></div>
    <div class="sw"><div class="chip" style="background:var(--indigo-600)"></div><div class="meta"><div class="name">indigo-600</div><div class="hex">#4F46E5</div></div></div>
    <div class="sw"><div class="chip" style="background:var(--indigo-700)"></div><div class="meta"><div class="name">indigo-700</div><div class="hex">#4338CA</div></div></div>
    <div class="sw"><div class="chip" style="background:var(--blue-600)"></div><div class="meta"><div class="name">blue-600</div><div class="hex">#2563EB</div></div></div>
    <div class="sw"><div class="chip" style="background:var(--blue-700)"></div><div class="meta"><div class="name">blue-700</div><div class="hex">#1D4ED8</div></div></div>
    <div class="sw"><div class="chip" style="background:var(--violet-400)"></div><div class="meta"><div class="name">violet-400</div><div class="hex">#A78BFA</div></div></div>
  </div>
</body>
</html>
