<!-- @dsCard group="Colors" viewport="700x150" name="Status" subtitle="Audit semantics: pass, before/warning, fail" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  body { padding: 24px; }
  .row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
  .sw { border-radius: var(--radius-md); overflow: hidden; border: 1px solid var(--border-subtle); }
  .chip { height: 60px; display: flex; align-items: center; padding: 0 16px; color: #fff; font-weight: 700; font-size: 13px; }
  .meta { padding: 8px 10px; }
  .name { font-size: 12px; font-weight: 600; color: var(--text-strong); }
  .hex { font-family: var(--font-mono); font-size: 11px; color: var(--text-muted); text-transform: uppercase; }
</style>
</head>
<body>
  <div class="row">
    <div class="sw"><div class="chip" style="background:var(--status-pass)">Pass / audited</div><div class="meta"><div class="name">status-pass</div><div class="hex">#16A34A</div></div></div>
    <div class="sw"><div class="chip" style="background:var(--status-before)">Before / warn</div><div class="meta"><div class="name">status-before</div><div class="hex">#F59E0B</div></div></div>
    <div class="sw"><div class="chip" style="background:var(--status-fail)">Not secure</div><div class="meta"><div class="name">status-fail</div><div class="hex">#EF4444</div></div></div>
  </div>
</body>
</html>
