<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  body { padding: 0; display: grid; grid-template-columns: 1fr 1fr; }
  .panel { display: flex; align-items: center; justify-content: center; padding: 24px; min-height: 300px; }
  .light { background: var(--surface-page); }
  .dark { background: radial-gradient(120% 120% at 50% 30%, var(--space-800), var(--space-950)); }
  img { max-height: 240px; width: auto; }
</style>
</head>
<body>
  <div class="panel light"><img src="../assets/jajo.png" alt="Layered sphere on light" /></div>
  <div class="panel dark"><img src="../assets/jajo.png" alt="Layered sphere on dark" /></div>
</body>
</html>
