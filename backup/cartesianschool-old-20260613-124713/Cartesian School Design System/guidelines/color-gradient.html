<!-- @dsCard group="Colors" viewport="700x190" name="Signature gradient" subtitle="The logo's violet→indigo→blue, for fills and text" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  body { padding: 24px; display: grid; gap: 14px; }
  .bar { height: 70px; border-radius: var(--radius-lg); }
  .fill { background: var(--brand-gradient); box-shadow: var(--glow-indigo); }
  .soft { background: var(--brand-gradient-soft); border: 1px solid var(--border-subtle); display: flex; align-items: center; justify-content: center; }
  .grad-word { font-size: 30px; font-weight: 800; letter-spacing: -0.02em; }
  .code { font-family: var(--font-mono); font-size: 11px; color: var(--text-muted); }
</style>
</head>
<body>
  <div class="bar fill"></div>
  <div class="bar soft"><span style="font-size:26px;font-weight:800;letter-spacing:-.02em;color:var(--text-strong)">Cartesian<span class="cs-gradient-text">School</span></span></div>
  <div class="code">--brand-gradient · --brand-gradient-text · --brand-gradient-soft</div>
</body>
</html>
