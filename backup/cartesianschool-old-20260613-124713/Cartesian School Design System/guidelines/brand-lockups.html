<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  body { padding: 0; display: grid; grid-template-columns: 1fr 1fr; }
  .panel { display: flex; align-items: center; justify-content: center; padding: 28px; min-height: 230px; }
  .light { background: var(--surface-page); }
  .dark { background: radial-gradient(120% 120% at 30% 20%, var(--space-800), var(--space-950)); }
  img { max-width: 88%; height: auto; }
</style>
</head>
<body>
  <div class="panel light"><img src="../assets/logo-full-light.png" alt="Cartesian School logo on light" /></div>
  <div class="panel dark"><img src="../assets/logo-full-dark.png" alt="Cartesian School logo on dark" /></div>
</body>
</html>
