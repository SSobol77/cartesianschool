<!-- @dsCard group="Type" viewport="700x180" name="Mono / metrics" subtitle="Geist Mono for audit numbers, URLs and code" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  body { padding: 28px; display: flex; gap: 28px; align-items: center; flex-wrap: wrap; }
  .metric { font-family: var(--font-mono); font-weight: 600; color: var(--text-strong); }
  .big { font-size: 40px; }
  .stat { color: var(--status-before); }
  .url { font-family: var(--font-mono); font-size: 14px; color: var(--text-accent); }
  .lbl { font-size: 11px; color: var(--text-muted); font-family: var(--font-mono); }
</style>
</head>
<body>
  <div><div class="metric big stat">21.8&thinsp;s</div><div class="lbl">Before · Google PSI</div></div>
  <div><div class="metric big" style="color:var(--status-pass)">46/100</div><div class="lbl">mobile speed</div></div>
  <div><div class="url">6-reliance-roofing.vercel.app</div><div class="lbl">live preview URL</div></div>
</body>
</html>
