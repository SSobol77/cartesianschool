<!-- @dsCard group="Components" viewport="700x440" name="Cards: feature, step & panels" subtitle="Feature grid, process step, dark & gradient panels" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../../styles.css" />
<style>
  body { padding: 28px; background: var(--surface-subtle); }
  .grid { display: flex; flex-direction: column; gap: 20px; }
  .three { display: grid; grid-template-columns: repeat(3,1fr); gap: 16px; }
  .two { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  .cap { font-family: var(--font-mono); font-size: 11px; color: var(--text-faint); margin-bottom: 6px; }
</style>
</head>
<body>
<div id="root"></div>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="https://unpkg.com/lucide@0.460.0/dist/umd/lucide.min.js"></script>
<script src="../../_ds_bundle.js"></script>
<script type="text/babel">
  const { FeatureCard, StepCard, Card, Button } = window.CartesianSchoolDesignSystem_f05947;
  const Ico = ({ n, s = 22 }) => <i data-lucide={n} style={{ width: s, height: s }}></i>;
  function Demo() {
    return (
      <div className="grid">
        <div>
          <div className="cap">feature cards</div>
          <div className="three">
            <FeatureCard icon={<Ico n="smartphone" />} title="Mobile-First" desc="Built for phones first. 60%+ of local searches are mobile." />
            <FeatureCard icon={<Ico n="zap" />} title="Lightning Fast" desc="Sub-second load times. Google ranks fast sites higher." />
            <FeatureCard icon={<Ico n="lock" />} title="HTTPS Secure" desc="No 'Not Secure' warnings. SSL included." />
          </div>
        </div>
        <div>
          <div className="cap">step card · panels</div>
          <div className="two">
            <StepCard n="01" icon={<Ico n="search" s={26} />} title="Free Audit" desc="We run Google's own tests and send a plain-language report." />
            <Card tone="gradient" padding="24px">
              <p style={{fontSize:12,fontWeight:600,textTransform:'uppercase',letterSpacing:'.08em',opacity:.8,margin:0}}>Fixed price</p>
              <div style={{fontSize:34,fontWeight:800,margin:'6px 0 10px'}}>Custom</div>
              <p style={{fontSize:13,opacity:.9,margin:'0 0 16px'}}>Quote after free audit. No surprises.</p>
              <Button tone="onDark" iconRight={<Ico n="arrow-right" s={16}/>}>Book a 10-minute call</Button>
            </Card>
          </div>
        </div>
      </div>
    );
  }
  ReactDOM.createRoot(document.getElementById("root")).render(<Demo />);
  setTimeout(() => window.lucide && window.lucide.createIcons(), 60);
</script>
</body>
</html>
