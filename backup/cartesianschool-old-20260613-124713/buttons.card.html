<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../../styles.css" />
<style>
  body { padding: 28px; background: var(--surface-page); }
  .grid { display: flex; flex-direction: column; gap: 22px; }
  .row { display: flex; gap: 14px; align-items: center; flex-wrap: wrap; }
  .dark { background: radial-gradient(120% 120% at 30% 0%, var(--space-800), var(--space-950)); padding: 18px 20px; border-radius: var(--radius-xl); }
  .cap { font-family: var(--font-mono); font-size: 11px; color: var(--text-faint); margin-bottom: 4px; }
</style>
</head>
<body>
<div id="root"></div>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="https://unpkg.com/lucide@0.460.0/dist/umd/lucide.min.js"></script>
<script src="../../_ds_bundle.js"></script>
<script type="text/babel">
  const { Button } = window.CartesianSchoolDesignSystem_f05947;
  const Ico = ({ n, s = 18 }) => <i data-lucide={n} style={{ width: s, height: s }}></i>;

  function Demo() {
    return (
      <div className="grid">
        <div>
          <div className="cap">tones</div>
          <div className="row">
            <Button tone="primary" iconRight={<Ico n="arrow-right" />}>Book a call</Button>
            <Button tone="secondary">Get free audit</Button>
            <Button tone="ghost" iconRight={<Ico n="arrow-up-right" />}>View live</Button>
            <Button tone="gradient">See it live</Button>
          </div>
        </div>
        <div>
          <div className="cap">sizes &amp; disabled</div>
          <div className="row">
            <Button tone="primary" size="sm">Small</Button>
            <Button tone="primary" size="md">Medium</Button>
            <Button tone="primary" size="lg">Large</Button>
            <Button tone="primary" disabled>Disabled</Button>
          </div>
        </div>
        <div>
          <div className="cap">on dark</div>
          <div className="dark row">
            <Button tone="onDark">Live preview</Button>
            <Button tone="gradient" iconRight={<Ico n="arrow-right" />}>Book a 10-min call</Button>
          </div>
        </div>
      </div>
    );
  }
  ReactDOM.createRoot(document.getElementById("root")).render(<Demo />);
  setTimeout(() => window.lucide && window.lucide.createIcons(), 60);
</script>
</body>
</html>
